[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "budget"
version = "0.0.0"
description = "Track Australian Federal Budget forward estimates against Final Budget Outcomes"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # - bespoke
    "mgplot",
    "readabs",                       # fetches ABS catalogue tables (your ~/readabs lib)
    # - document parsing (BP1 / FBO source documents)
    "python-docx",
    "pdfplumber",                    # for pre-2019-20 FBO PDFs (no DOCX upstream)
    "pymupdf",                       # 10-20x faster than pdfplumber; outline support for targeted page reads
    # - data science
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "openpyxl",
    "xlrd",
    "babel",
    # - internet (in case we need to refresh source docs)
    "requests",
    "bs4",
    "lxml>=6.1.0",
    "html5lib",
    # - code
    "black",
    "pylint",
    "ruff",
    "mypy",
    # - typing
    "pandas-stubs",
    "numpy-typing",
]

[tool.ruff]
line-length=119
lint.select = [ "ALL" ]  # Aggressively select all rules
lint.ignore = [
    # --- general rules to ignore
    "COM812",  # missing or trailing comma - recommended by ruff format
    "D203",    # Incorrect blank line before class - recommended by ruff check
    "D213",    # Multi-line docstring summary should start at the first line - recommended by ruff
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
    "T201",    # Remove `print` --> But I use print to alert the user
    "TRY003",  # Long exception messages.
    "PD008",   # mypy doesnt like .loc[] / ruff doesn't like .at[]
    "RUF001",  # ambiguous Unicode in strings
    "RUF002",  # ambiguous Unicode in docstrings
    "RUF003",  # ambiguous Unicode in comments
    "FBT001",  # boolean positional argument
    "FBT002",  # boolean default positional argument
    "ERA001",  # commented-out code
    "RUF022",  # __all__ not sorted - prefer categorical grouping for readability
    "TC001",   # move application import into TYPE_CHECKING block - too aggressive
    "TC002",   # move third-party import into TYPE_CHECKING block - too aggressive
    "D100",    # Missing docstring in public module
    "PLR0913", # Too many arguments
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
