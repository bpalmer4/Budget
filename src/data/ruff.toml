# Parsers walk PDF/DOCX text line by line and are branchy by nature, so they get
# looser complexity limits than the rest of the project. Everything else comes
# from the project's pyproject.toml.
extend = "../../pyproject.toml"
src = ["../..", "../../src"]  # same source roots as the project, so `src.` imports sort as first-party

[lint.mccabe]
max-complexity = 20  # default 10

[lint.pylint]
max-branches = 21    # default 12
max-statements = 60  # default 50
max-returns = 7      # default 6
